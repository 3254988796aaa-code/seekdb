name: Validate ANN predicate correction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_HOME: /tmp/ann-filter-validation/rustup
      CARGO_HOME: /tmp/ann-filter-validation/cargo
      XDG_CACHE_HOME: /tmp/ann-filter-validation/build-cache
      TELEMETRY_ENABLED: 'false'
      RUSTUP_DIST_SERVER: https://static.rust-lang.org
      RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
    steps:
      - name: Checkout correction
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d636e2763eb2ce0a07541329db8c6ddbaf786237
          persist-credentials: false

      - name: Prepare host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git wget curl rpm rpm2cpio cpio make build-essential binutils m4 file libaio1 python3-yaml
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source-head.txt

      - name: Prepare pinned dependencies
        run: |
          set -o pipefail
          python3 build.py init 2>&1 | tee evidence/init.log

      - name: Build production executable
        id: build
        run: |
          set -o pipefail
          python3 build.py build --host_jvm_args=-Xmx768m --jobs=4 seekdb 2>&1 | tee evidence/build.log
          build/bin/src/observer/seekdb --version | tee evidence/version.txt

      - name: Preserve the compiled runtime
        run: |
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('evidence/compiled-runtime.tar.gz', 'w:gz', dereference=True) as bundle:
              bundle.add('build/bin/src/observer/seekdb', arcname='seekdb')
              bundle.add('deps/3rd/u01/obclient', arcname='obclient')
              bundle.add('evidence/source-head.txt', arcname='source-head.txt')
          PY
          ldd build/bin/src/observer/seekdb > evidence/runtime-libraries.txt

      - name: Run the new and existing regressions
        run: |
          set -o pipefail
          python3 tools/deploy/mysqltest.py run \
            --base-dir "$RUNNER_TEMP/ann-check-instance" \
            --work-dir "$GITHUB_WORKSPACE/evidence/check" --port 2894 \
            --test-set vector_index.ann_filter_canonicalization,vector_index.vector_index_bugfix1,vector_index.vector_similarity \
            --parameter memory_budget=2G --parameter cpu_count=2 \
            2>&1 | tee evidence/check.log

      - name: Verify the new regression rejects the official old release
        run: |
          mkdir -p "$RUNNER_TEMP/ann-baseline"
          curl -fL --retry 2 https://github.com/oceanbase/seekdb/releases/download/v1.4.0/seekdb-1.4.0-100000172026082615.el7.x86_64.rpm -o "$RUNNER_TEMP/ann-baseline/seekdb.rpm"
          (cd "$RUNNER_TEMP/ann-baseline" && rpm2cpio seekdb.rpm | cpio -idm --quiet)
          set +e
          python3 tools/deploy/mysqltest.py run \
            --seekdb "$RUNNER_TEMP/ann-baseline/usr/bin/seekdb" \
            --base-dir "$RUNNER_TEMP/ann-old-instance" \
            --work-dir "$GITHUB_WORKSPACE/evidence/old-release" --port 2894 \
            --test-set vector_index.ann_filter_canonicalization \
            --parameter memory_budget=2G --parameter cpu_count=2 \
            > evidence/old-release.log 2>&1
          result=$?
          set -e
          cat evidence/old-release.log
          if [ "$result" -eq 0 ]; then
            echo 'Old release unexpectedly passed the new regression' >&2
            exit 1
          fi
          grep -ERq 'AND absorption must eliminate the redundant parity filter' evidence/old-release*
          echo 'Old release fails the predicate absorption assertion, as expected'

      - name: Check intended patch
        run: |
          git diff --check -- src/sql/rewrite/ob_transformer_impl.cpp tools/deploy/mysql_test/test_suite/vector_index/t/ann_filter_canonicalization.test tools/deploy/mysql_test/test_suite/vector_index/r/mysql/ann_filter_canonicalization.result

      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ann-filter-validation
          retention-days: 14
          path: |
            evidence/
            tools/deploy/mysql_test/test_suite/vector_index/r/mysql/ann_filter_canonicalization.result
